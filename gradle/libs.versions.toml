[versions]
kotlin = "2.4.20"
compose = "1.12.2"
navigation3 = "1.1.1"
materialSymbols = "2.2.1"
room = "3.0.3"
sqlite = "2.7.1"
ksp = "2.3.12"
coroutines = "1.11.0"
koin = "4.2.2"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "compose" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

materialSymbols-outlined = { module = "com.composables:icons-material-symbols-outlined-cmp", version.ref = "materialSymbols" }
materialSymbols-rounded = { module = "com.composables:icons-material-symbols-rounded-cmp", version.ref = "materialSymbols" }
materialSymbols-sharp = { module = "com.composables:icons-material-symbols-sharp-cmp", version.ref = "materialSymbols" }
materialSymbols-outlinedFilled = { module = "com.composables:icons-material-symbols-outlined-filled-cmp", version.ref = "materialSymbols" }
materialSymbols-roundedFilled = { module = "com.composables:icons-material-symbols-rounded-filled-cmp", version.ref = "materialSymbols" }
materialSymbols-sharpFilled = { module = "com.composables:icons-material-symbols-sharp-filled-cmp", version.ref = "materialSymbols" }

room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[bundles]
materialSymbols = [
    "materialSymbols-outlined",
    "materialSymbols-rounded",
    "materialSymbols-sharp",
    "materialSymbols-outlinedFilled",
    "materialSymbols-roundedFilled",
    "materialSymbols-sharpFilled",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room3", version.ref = "room" }
